<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TCG Cards</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        header {
            text-align: center;
            padding: 20px;
            font-size: 2rem;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .card h2 {
            margin: 10px 0 5px;
        }

        .card p {
            font-size: 0.9rem;
            color: #cbd5f5;
        }

        .raridade {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .comum { background: gray; }
        .rara { background: royalblue; }
        .epica { background: purple; }
        .lendaria { background: gold; color: black; }

    </style>
</head>
<body>

<header>✨ TCG Cards Collection</header>

<div class="container">

    <div class="card">
        <span class="raridade comum">Comum</span>
        <img src="https://picsum.photos/300/200?1">
        <h2>Guerreiro da Terra</h2>
        <p>Ataque: 120 | Defesa: 80</p>
    </div>

    <div class="card">
        <span class="raridade rara">Rara</span>
        <img src="https://picsum.photos/300/200?2">
        <h2>Mago Arcano</h2>
        <p>Ataque: 200 | Defesa: 50</p>
    </div>

    <div class="card">
        <span class="raridade epica">Épica</span>
        <img src="https://picsum.photos/300/200?3">
        <h2>Dragão Sombrio</h2>
        <p>Ataque: 350 | Defesa: 200</p>
    </div>

    <div class="card">
        <span class="raridade lendaria">Lendária</span>
        <img src="https://picsum.photos/300/200?4">
        <h2>Fênix Celestial</h2>
        <p>Ataque: 500 | Defesa: 300</p>
    </div>

</div>

</body>
</html>

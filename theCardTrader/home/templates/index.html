<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TCG Cards</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        header {
            text-align: center;
            padding: 20px;
            font-size: 2rem;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .card h2 {
            margin: 10px 0 5px;
        }

        .card p {
            font-size: 0.9rem;
            color: #cbd5f5;
        }

        .raridade {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .comum { background: gray; }
        .rara { background: royalblue; }
        .epica { background: purple; }
        .lendaria { background: gold; color: black; }

    </style>
</head>
<body>

<header>✨ TCG Cards Collection</header>
<style id="u9y0lm">
    body {
        font-family: Arial, sans-serif;
        background-color: #0f172a;
        color: #fff;
    }

    .menu {
        max-width: 400px;
        margin: 40px auto;
        padding: 20px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    .menu h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .menu a {
        display: block;
        padding: 12px;
        margin: 8px 0;
        text-decoration: none;
        color: white;
        background: #3b82f6;
        border-radius: 8px;
        text-align: center;
        transition: 0.3s;
    }

    .menu a:hover {
        background: #2563eb;
        transform: scale(1.03);
    }
</style>

<div class="menu">
    <h2>📦 Card Trader</h2>

    <a href="{% url 'detalhes_do_deck' %}">🧩 Detalhes do Deck</a>

</html>
